---
name: "Auto Assign Author"

# Calls velero-io/velero's reusable workflow so this repo stays in sync with
# core's auto-assign + CODEOWNERS re-request-review logic instead of
# maintaining a separate, drifted local copy. Needs .github/auto-assignees.yml
# (already present in this repo) and .github/CODEOWNERS (added alongside this
# file) for the called workflow to behave correctly.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-assign:
    uses: velero-io/velero/.github/workflows/auto_assign_prs.yml@main
    secrets: inherit
